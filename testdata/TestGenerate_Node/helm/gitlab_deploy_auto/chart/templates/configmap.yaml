{{/* Code generated by kickr; DO NOT EDIT. */}}

{{- $fullname := include (print .Chart.Name ".fullname") . -}}

{{- define "kickr.configmap.item" -}}
{{- $item := . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ print $item.fullname "-" $item.name }}
data:
{{- range $item.configMap.tpl_folders }}
{{- range $path, $_ := $item.root.Files.Glob (print . "/*") }}
  {{ base $path }}: |-
    {{- tpl ($item.root.Files.Get $path) $item.config | trimSuffix "\n" | nindent 4 }}
{{- end }}
{{- end }}

{{- range $item.configMap.include_folders }}
{{- range $path, $_ := $item.root.Files.Glob (print . "/*") }}
  {{ base $path }}: |-
    {{- $item.root.Files.Get $path | trimSuffix "\n" | nindent 4 }}
{{- end }}
{{- end }}

{{- with $item.configMap.data }}
  {{- tpl (toYaml .) $item.config | nindent 2 }}
{{- end }}
{{- end -}}

{{- $items := list }}
{{- range $name, $config := merge .Values.crons .Values.jobs .Values.workers }}
{{- with $config.configMap }}
{{- $items = append $items (dict "fullname" $fullname "name" $name "config" $config "configMap" . "root" $) }}
{{- end }}
{{- end }}
{{- if $items }}
---
apiVersion: v1
kind: List
items:
  {{- range $items }}
  - {{ include "kickr.configmap.item" . | nindent 4 | trim }}
  {{- end }}
{{- end -}}
