        options:
          - full
          - none
        default: none
      pages:
        description: Pages deployment mode.
        type: choice
        options:
          - full
          - none
        default: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-workflow:
    name: Run
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - id: conclusion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          result-encoding: string
          script: |-
            const { data } = await github.rest.actions.listWorkflowRuns({
              branch: process.env.GITHUB_REF_NAME,
              owner: context.repo.owner,
              page: 1,
              per_page: 1,
              repo: context.repo.repo,
              workflow_id: process.env.WORKFLOW_ID,
            })

            const latest = data.workflow_runs.at(0)
            if (!latest) {
              throw new Error(`No '${process.env.WORKFLOW_ID}' workflow runs found on ref name '${process.env.GITHUB_REF_NAME}'`)
            }
            return latest.conclusion
        env:
          WORKFLOW_ID: integration.yml
      - if: ${{ steps.conclusion.outputs.result != 'success' }}
        run: |-
          echo "Latest '$WORKFLOW_ID' workflow on '$GITHUB_REF_NAME' isn't in success conclusion: '$WORKFLOW_CONCLUSION'" && exit 1
        env:
          WORKFLOW_CONCLUSION: ${{ steps.conclusion.outputs.result }}
          WORKFLOW_ID: integration.yml

  version:
    name: Version
    runs-on: ubuntu-latest
    needs: run-workflow
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |-
          DESCRIBE=$(git describe --tags || echo "v0.0.0")
          echo "version=v${DESCRIBE#v}" >> $GITHUB_OUTPUT
      - run: echo ${APP_VERSION}
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

  hugo-build:
    name: Hugo Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: build-docs-pages
            directory: docs
            name: (docs)
          - artifact: build-website
            directory: website
            name: (website)
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fetch all history for .GitInfo and .Lastmod
          submodules: true # fetch Hugo themes
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-tags packageName=jdx/mise depName=mise
          version: v2026.8.10
          install: false
          cache: true
      - run: |-
          # renovate: datasource=golang-version packageName=golang/go depName=golang
          - mise use -g golang@1.27.0
          # renovate: datasource=github-tags packageName=gohugoio/hugo depName=hugo
          - mise use -g hugo-extended@0.165.0
          # renovate: datasource=github-tags packageName=sass/dart-sass depName=dart-sass
          - mise use -g github:sass/dart-sass@1.103.1
      - run: hugo build --gc --destination dist --logLevel "$LOG_LEVEL"
        env:
          LOG_LEVEL: ${{ vars.HUGO_LOG_LEVEL || 'info' }}
          APP_VERSION: ${{ needs.version.outputs.version }}
      - if: ${{ endsWith(matrix.artifact, '-pages') }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.directory }}/dist
          retention-days: 1
      - if: ${{ !endsWith(matrix.artifact, '-pages') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.directory }}/dist
          retention-days: 1

  netlify-deploy:
    name: Netlify (${{ matrix.environment }})
    runs-on: ubuntu-latest
    if: ${{ inputs.netlify != 'none' }}
    needs:
      - hugo-build
    environment:
      name: ${{ matrix.environment }}
      url: ${{ steps.netlify.outputs.deploy-url }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          - review
          - production
        production:
          - ${{ github.ref_name == github.event.repository.default_branch }}
        protected:
          - ${{ github.ref_name == github.event.repository.default_branch || github.ref_protected }}
        # see https://github.com/orgs/community/discussions/26253#discussioncomment-3250989
        # for more information about how to include environments depending on branches
        include:
          - environment: review # enabled on non-protected branches
            protected: false
          - environment: production # enabled on production branches
            production: true
    permissions:
      deployments: write
      pull-requests: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-website
          path: dist
      - id: branch_sha
        run: echo "branch_sha=$(echo "$GITHUB_REF_NAME" | sha256sum | cut -c -8)" >> $GITHUB_OUTPUT
      - id: config
        run: |-
          [ ! -f netlify.toml ] || echo "path=netlify.toml" >> $GITHUB_OUTPUT
      # https://github.com/marketplace/actions/netlify-actions
      - id: netlify
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4
        with:
          alias: ${{ steps.branch_sha.outputs.branch_sha }}
          deploy-message: ${{ github.ref_name }}
          enable-commit-comment: false
          enable-commit-status: false
          github-deployment-environment: ${{ matrix.environment }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          netlify-config-path: ${{ steps.config.outputs.path }}
          production-deploy: ${{ matrix.environment == 'production' }}
          publish-dir: dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}

  pages:
    name: Pages
    runs-on: ubuntu-latest
    if: ${{ inputs.pages != 'none' }}
    needs:
      - hugo-build
    environment:
      name: pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
