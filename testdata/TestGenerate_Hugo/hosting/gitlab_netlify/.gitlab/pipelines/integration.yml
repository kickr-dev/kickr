# Code generated by kickr; DO NOT EDIT.

---
include:

  # pre-commit template
  # https://gitlab.com/to-be-continuous/pre-commit
  - remote: https://gitlab.com/to-be-continuous/pre-commit/-/raw/545565bb99ba3b932c9f1f244d446d5ff3f77b40/templates/gitlab-ci-pre-commit.yml # 1.6.0
    inputs:
      pre-commit-file: .pre-commit-config.yaml

  # Plumber template
  # https://gitlab.com/getplumber/plumber
  - remote: https://gitlab.com/getplumber/plumber/-/raw/c342d11f758f4386d9d2c42333cd1c4ae2d5448a/templates/plumber.yml # v0.5.16
    inputs:
      allow_failure: true
      badge: false
      config_file: .gitlab/plumber.yml
      gitlab_token: $PLUMBER_GITLAB_TOKEN
      image: $PLUMBER_IMAGE
      mr_comment: false
      score_point: true
      score_push: true

hugo-build:
  image:
    name: $HUGO_IMAGE
    entrypoint: [""]
  stage: build
  needs:
    - semantic-release-info
  variables:
    GIT_DEPTH: "0" # fetch all history for .GitInfo and .Lastmod
    GIT_SUBMODULE_STRATEGY: recursive # fetch Hugo themes
    HUGO_PROJECT_DIR: .
  rules:
    - !reference [.test-policy, rules]
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - cd "$HUGO_PROJECT_DIR"
    - hugo build --gc --destination "$BUILD_DIR" --logLevel "${LOG_LEVEL:-info}"
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    paths:
      - $HUGO_PROJECT_DIR/$BUILD_DIR
    expire_in: 1 day

plumber:
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ $INTEG_REF || $CI_COMMIT_REF_NAME =~ $PROD_REF'
