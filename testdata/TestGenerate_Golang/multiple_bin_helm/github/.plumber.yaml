        - aws-actions/* # Amazon Web Services
        - Azure/* # Microsoft Azure
        - canonical/* # Canonical / Ubuntu
        - cloudflare/* # Cloudflare (wrangler-action)
        - digitalocean/* # DigitalOcean
        - fastly/* # Fastly
        - google-github-actions/* # Google Cloud
        - googleapis/* # Google (release-please-action)
        - hashicorp/* # HashiCorp (IBM)
        - ibm/* # IBM
        - oracle-actions/* # Oracle
        - pulumi/* # Pulumi
        # ── Container / build / release / CI tooling ─────────────────
        - bazel-contrib/* # Bazel community / Linux Foundation
        - buildkite/* # Buildkite
        - CircleCI-Public/* # CircleCI
        - dagger/* # Dagger
        - docker/* # Docker, Inc.
        - earthly/* # Earthly
        - goreleaser/* # GoReleaser
        - gradle/* # Gradle
        - jdx/* # mise (mise-action)
        - jfrog/* # JFrog
        - release-drafter/* # Release Drafter
        # ── Language & packaging ecosystems ──────────────────────────
        - astral-sh/* # Astral (uv, ruff)
        - conda-incubator/* # Conda
        - dart-lang/* # Dart / Google
        - denoland/* # Deno
        - erlef/* # Erlang Ecosystem Foundation
        - gleam-lang/* # Gleam
        - golangci/* # golangci-lint
        - haskell-actions/* # Haskell
        - julia-actions/* # Julia
        - ocaml/* # OCaml
        - oven-sh/* # Bun (Oven, Inc.)
        - pypa/* # Python Packaging Authority
        - r-lib/* # R
        - ruby/* # Ruby
        - sbt/* # sbt build tool
        - VirtusLab/* # Scala CLI
        # ── Security vendors & supply-chain projects ─────────────────
        - anchore/* # Anchore (sbom-action, scan-action)
        - aquasecurity/* # Aqua Security (trivy-action)
        - bridgecrewio/* # Bridgecrew / Palo Alto (checkov)
        - chainguard-dev/* # Chainguard
        - checkmarx-ts/* # Checkmarx TS
        - Checkmarx/* # Checkmarx
        - getplumber/* # Plumber (this tool's own actions)
        - GitGuardian/* # GitGuardian
        - gitleaks/* # Gitleaks
        - in-toto/* # in-toto / supply-chain attestation
        - orcasecurity/* # Orca Security
        - ossf/* # OpenSSF / Linux Foundation (scorecard-action)
        - oxsecurity/* # OX Security (MegaLinter)
        - Qualys/* # Qualys
        - semgrep/* # Semgrep
        - sigstore/* # Sigstore / LF (cosign-installer)
        - slsa-framework/* # SLSA / OpenSSF
        - snyk/* # Snyk
        - SonarSource/* # SonarSource
        - sonatype-nexus-community/* # Sonatype community
        - sonatype/* # Sonatype
        - step-security/* # StepSecurity (harden-runner)
        - tenable/* # Tenable
        - trufflesecurity/* # Truffle Security
        - veracode/* # Veracode
        - zaproxy/* # OWASP ZAP
        # ── Dev platforms / SaaS with mature security programs ───────
        - adobe/* # Adobe
        - atlassian/* # Atlassian
        - codecov/* # Codecov (pin by SHA — 2021 breach)
        - cypress-io/* # Cypress.io
        - DataDog/* # Datadog
