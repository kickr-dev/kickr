version: "2.0"

# ============================================================================
# GitHub Actions controls
# ============================================================================
github:
  controls:
    # ===========================================
    # Actions must be pinned by commit SHA
    # ===========================================
    # Flags workflow steps whose `uses:` reference isn't a 40-character commit SHA.
    actionsMustBePinnedByCommitSha:
      enabled: true
      # Action-owner prefixes exempt from the pin-by-SHA requirement.
      trustedOwners:
        - actions
        - github

    # ===========================================
    # Actions must come from authorized sources
    # ===========================================
    # Restricts which `uses:` action sources are allowed, org-scoped wildcards (`owner/*`) only.
    # Owner matching is literal and CASE-SENSITIVE, mixed-case orgs are listed in both forms.
    githubActionMustComeFromAuthorizedSources:
      enabled: true
      trustGithubOfficialActions: true # actions/* and github/*
      trustSameOrgActions: true # action owner == scanned repo owner
      minimumStars: 20000 # popular-by-adoption floor (requires API access)
      trustedGithubActions:
