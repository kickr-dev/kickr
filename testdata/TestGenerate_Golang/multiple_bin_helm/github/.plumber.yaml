        - supabase/* # Supabase
        # ── CNCF / infrastructure foundations ────────────────────────
        - ansible-community/* # Ansible community
        - ansible/* # Ansible / Red Hat
        - helm/* # Helm / CNCF
        - kubernetes-sigs/* # Kubernetes SIGs / CNCF
        - opentofu/* # OpenTofu / Linux Foundation
        - terraform-linters/* # tflint (setup-tflint)
        # ── Project orgs & widely-adopted publishers ─────────────────
        - 1Password/* # 1Password
        - android-actions/* # Android
        - anthropics/* # Anthropic (claude-code-action)
        - apache/* # Apache Software Foundation
