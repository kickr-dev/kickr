        - devcontainers/* # devcontainers org (Microsoft-stewarded)
        - digicert/* # DigiCert (pin by SHA — high blast radius)
        - EmbarkStudios/* # Embark Studios (cargo-deny)
        - emscripten-core/* # Emscripten project
        - flatpak/* # Flatpak project
        - fsfe/* # Free Software Foundation Europe (reuse-action)
        - gittools/* # GitTools (GitVersion)
        - go-task/* # go-task / taskfile.dev
        - golang/* # Go team (govulncheck-action)
        - google/* # Google (oss-fuzz, etc.)
        - graalvm/* # Oracle GraalVM
        - hadolint/* # hadolint
        - Homebrew/* # Homebrew project
        - linear/* # Linear
        - ludeeus/* # action-shellcheck
        - msys2/* # MSYS2
        - namespacelabs/* # Namespace Labs
        - nix-community/* # Nix community
        - NuGet/* # Microsoft / .NET Foundation
        - nwtgck/* # actions-netlify
        - octokit/* # GitHub Octokit org
        - openai/* # OpenAI (codex-action)
        - peter-evans/* # Peter Evans (widely-adopted PR/comment actions; pin by SHA)
        - pnpm/* # pnpm package manager
        - pre-commit/* # pre-commit
        - prefix-dev/* # prefix.dev (pixi)
        - PyO3/* # PyO3 org (maturin)
        - qltysh/* # Qlty Software
        - redhat-actions/* # Red Hat
        - renovatebot/* # Mend.io (renovate)
        - reviewdog/* # reviewdog
        - rubygems/* # RubyGems
        - rust-lang/* # Rust project / crates.io
        - scientific-python/* # scientific-python consortium
        - signpath/* # SignPath GmbH
        - slackapi/* # Slack
        - stefanzweifel/* # git-auto-commit-action
        - tailscale/* # Tailscale
        - tauri-apps/* # Tauri
        - voidzero-dev/* # VoidZero (pin by SHA — remote install script)
        - zizmorcore/* # zizmor scanner (Trail of Bits ecosystem)
        # ── Lowercase case-aliases (literal matcher is case-sensitive) ──
        - 1password/* # = 1Password/*
        - apple-Actions/* # mixed-case form of apple-actions/*
        - azure/* # = Azure/*
        - checkmarx/* # = Checkmarx/*
        - circleci-public/* # = CircleCI-Public/*
        - datadog/* # = DataDog/*
        - determinatesystems/* # = DeterminateSystems/*
        - embarkstudios/* # = EmbarkStudios/*
        - gitguardian/* # = GitGuardian/*
        - homebrew/* # = Homebrew/*
        - jetbrains/* # = JetBrains/*
        - nuget/* # = NuGet/*
        - pyo3/* # = PyO3/*
        - qualys/* # = Qualys/*
        - shopify/* # = Shopify/*
        - sonarsource/* # = SonarSource/*
        - virtuslab/* # = VirtusLab/*

    # ===========================================
    # Container images must not use forbidden reference
    # ===========================================
    # Same control as GitLab, with GitHub-side values.
    containerImageMustNotUseForbiddenTags:
      enabled: true
      tags:
        - latest
        - dev
        - development
        - staging
        - main
        - master
      # When true, ALL images must be pinned by digest (e.g. alpine@sha256:...), taking precedence over the tags list.
      containerImagesMustBePinnedByDigest: true

    # ===========================================
    # Pipeline must not use Docker-in-Docker
    # ===========================================
    # Flags `docker:dind` services, plus plaintext DOCKER_HOST and empty DOCKER_TLS_CERTDIR values.
    pipelineMustNotUseDockerInDocker:
      enabled: true
      detectInsecureDaemon: true

    # ===========================================
    # Pipeline must not execute unverified scripts
    # ===========================================
    # Scans every workflow `run:` step for pipe-to-shell, download-then-exec and base64-obfuscated payloads.
    pipelineMustNotExecuteUnverifiedScripts:
      enabled: true
      trustedUrls: []
      # - https://internal-artifacts.example.com/*

    # ===========================================
    # Reusable workflows must not inherit secrets
    # ===========================================
    # Detects `jobs.<name>.secrets: inherit` calls, use an explicit secrets map instead.
    reusableWorkflowsMustNotInheritSecrets:
      enabled: true

    # ===========================================
    # Checkout must not persist credentials
    # ===========================================
    # Flags `actions/checkout` without `persist-credentials: false` (GITHUB_TOKEN left in `.git/config`).
    checkoutMustNotPersistCredentials:
      enabled: true

    # ===========================================
    # Workflow must not export the entire secrets context
    # ===========================================
    # Flags jobs serializing the whole `secrets` context with toJson(secrets), reference each secret by name instead.
    workflowMustNotExportEntireSecretsContext:
      enabled: true

    # ===========================================
    # Security jobs must not be weakened
    # ===========================================
    # Security jobs must not be neutralized via `continue-on-error: true` or manual-dispatch-only triggers.
    # Patterns are globs matched against `<workflow filename without extension>/<job id>` (e.g. codeql/analyze).
    securityJobsMustNotBeWeakened:
      enabled: true
      securityJobPatterns:
        - "*codeql*"
        - "*dependency-review*"
        - "*trufflehog*"
        - "*gitleaks*"
        - "*osv-scanner*"
        - "*semgrep*"
        - "*trivy*"
        - "*snyk*"
        - "*-sast"
        - "*-sast-*"
        - "*-scan"
        - "*scan*"
        - "*-security"
        - "*-security-*"
        - "*-audit"
        - "*-audit-*"
        - "*secret*detect*"
        - "*detect*secret*"
      allowFailureMustBeFalse:
        enabled: true
      rulesMustNotBeRedefined:
        enabled: true
      whenMustNotBeManual:
        enabled: true

    # ===========================================
    # Workflows must not inject user input in scripts
    # ===========================================
    # Catches attacker-controlled `github.event.*`, `github.head_ref` or `github.actor` expressions interpolated into `run:`, bind through `env:` first.
    workflowMustNotInjectUserInputInScripts:
      enabled: true

    # ===========================================
    # Workflow must not write untrusted content to $GITHUB_ENV / $GITHUB_PATH
    # ===========================================
    # Flags `run:` steps writing attacker-controlled expressions into $GITHUB_ENV or $GITHUB_PATH.
    workflowMustNotWriteUntrustedContentToGitHubEnv:
      enabled: true

    # ===========================================
    # Workflows must not use dangerous triggers
    # ===========================================
    # Flags `pull_request_target` and `workflow_run` triggers (base repository secrets, influenceable by unprivileged callers).
    workflowMustNotUseDangerousTriggers:
      enabled: true

    # ===========================================
    # pull_request_target workflows must not check out the PR head
    # ===========================================
    # Flags `pull_request_target` workflows checking out the pull request head (secrets and fork code run together).
    pullRequestTargetMustNotCheckoutHead:
      enabled: true

    # ===========================================
    # Workflows must declare permissions
    # ===========================================
    # Flags workflows without an explicit `permissions:` block (falls back to the repository default GITHUB_TOKEN).
    workflowsMustDeclarePermissions:
      enabled: true

    # ===========================================
    # Branch must be protected (project governance)
    # ===========================================
    # Inspects repository settings via the GitHub branch-protection API.
    # Full detail requires a token with `repo` scope or "Administration: read", emits no findings otherwise.
    branchMustBeProtected:
      enabled: true
      defaultMustBeProtected: true
      namePatterns:
        - main
        - master
        - release/*
        - production
        - dev
      allowForcePush: false
      # Require code-owner approval on protected branches.
      codeOwnerApprovalRequired: true

    # ============================================================================
    # Workflows must include required actions
    # ============================================================================
    # Asserts that workflows collectively reference a set of required actions or reusable workflows, enabled with nothing set it checks nothing.
    # Use one of:
    #   required: (myorg/sast-scan AND myorg/secret-scan) OR myorg/full-security-suite
    #   requiredGroups: [["myorg/sast-scan", "myorg/dependency-review"], ["myorg/full-security-suite"]]
    workflowMustIncludeRequiredActions:
      enabled: true
      # required: myorg/sast-scan AND myorg/policy/.github/workflows/scan.yml
      requiredGroups: []

    # ===========================================
    # Workflow must not grant write-all permissions
    # ===========================================
    # Flags workflows and jobs whose effective `permissions:` is `write-all`.
    workflowMustNotGrantPermissionsWriteAll:
      enabled: true

    # ===========================================
    # Actions must not use ambiguous tag/branch refs
    # ===========================================
    # Flags `uses: owner/repo@ref` refs resolving upstream as both a tag and a branch (pin to a 40-char commit SHA instead).
    # Requires GitHub API auth, abstains otherwise.
    externalRefsMustNotCollide:
      enabled: true

    # ===========================================
    # Actions must not reference archived repositories
    # ===========================================
    # Flags `uses: owner/repo@ref` references whose upstream repository is archived.
    # Requires GitHub API auth, abstains otherwise.
    actionsMustNotBeArchived:
      enabled: true

    # ===========================================
    # Actions must pin commits that exist upstream
    # ===========================================
    # Flags `uses: owner/repo@<sha>` references pinned to a commit SHA the upstream repository confirms doesn't exist.
    # Requires GitHub API auth, abstains otherwise.
    actionRefsMustExistUpstream:
      enabled: true

    # ===========================================
    # Actions must not carry known CVEs
    # ===========================================
    # Cross-references every `uses: owner/repo@ref` against the GitHub Advisory Database (`actions` ecosystem).
    # Requires GitHub API auth, abstains otherwise.
    actionsMustNotCarryKnownCVEs:
      enabled: true

    # ===========================================
    # Actions must not execute mutable remote code
    # ===========================================
    # Flags third-party actions fetching and executing a script from a moving ref (main/master/HEAD) of another repository.
    # Requires GitHub API auth.
    actionsMustNotExecuteMutableRemoteCode:
      enabled: true

    # ===========================================
    # Release workflows must not restore an untrusted cache
    # ===========================================
    # Flags release/publish jobs restoring a build cache whose key isn't scoped to the release ref (github.ref_name / github.sha).
    releaseWorkflowsMustNotRestoreUntrustedCache:
      enabled: true
      # Actions that publish/release artifacts.
      publishActions:
        - pypa/gh-action-pypi-publish
        - JS-DevTools/npm-publish
        - gradle/publish-plugin
        - softprops/action-gh-release
        - ncipollo/release-action
        - goreleaser/goreleaser-action
        - crazy-max/ghaction-docker-buildx
        - changesets/action
      # Cache-restoring actions and their mode:
      #   always  — restores whenever present
      #   default — restores unless disableInput holds disableValue
      #   opt-in  — restores only when enableInput names a package manager (enableContains further requires that substring in the value)
      cacheActions:
        - {action: actions/cache, mode: always}
        - {action: actions/cache/restore, mode: always}
        - {action: Swatinem/rust-cache, mode: always}
        - {action: actions/setup-go, mode: default, disableInput: cache, disableValue: false}
        - {action: gradle/actions/setup-gradle, mode: default, disableInput: cache-disabled, disableValue: true}
        - {action: actions/setup-node, mode: opt-in, enableInput: cache}
        - {action: actions/setup-python, mode: opt-in, enableInput: cache}
        - {action: actions/setup-java, mode: opt-in, enableInput: cache}
        - {action: pnpm/action-setup, mode: opt-in, enableInput: cache}
        - {action: docker/build-push-action, mode: opt-in, enableInput: cache-from, enableContains: type=gha}
      # Shell commands (regex) marking a job as release intent even without a publish action.
      publishScriptPatterns:
        - '(?i)(npm|pnpm|yarn|bun)\s+publish'
        - '(?i)cargo\s+publish'
        - '(?i)twine\s+upload'
        - '(?i)poetry\s+publish'
        - '(?i)gh\s+release\s+create'
        - '(?i)goreleaser\s+release'
        - '(?i)semantic-release'
        - '(?i)gradlew?\b[^\n]*\bpublish'
        - '(?i)\bmvnw?\b[^\n]*\bdeploy\b'
        - '(?i)dotnet\s+nuget\s+push'
        - '(?i)gem\s+push'
        - '(?i)docker\s+push'
      # Verification-only forms vetoing a publish-script match on the same run block.
      publishScriptExcludePatterns:
        - '(?i)--dry-run'
        - '(?i)publishToMavenLocal'
      # Jobs to exempt from this control (glob on `<workflow-file>/<job-id>`).
      allowedJobs: []
        # - '*/lint'
        # - 'release-docs/*'

    # ===========================================
    # Pipeline must not enable debug trace
    # ===========================================
    # Flags workflows or jobs setting debug-trace toggles to a truthy value, which dumps every environment variable into the job log.
    pipelineMustNotEnableDebugTrace:
      enabled: true
      forbiddenVariables:
        - ACTIONS_STEP_DEBUG
        - ACTIONS_RUNNER_DEBUG
