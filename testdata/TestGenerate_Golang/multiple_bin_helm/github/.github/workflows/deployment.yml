name: Deployment
run-name: Deployment

on:
  workflow_dispatch:
    inputs:
      helm_deploy:
        description: Helm deployment mode.
        type: choice
        options:
          - --dry-run=client
          - --dry-run=none
          - --dry-run=server
          - none
        default: --dry-run=server
      helm_push:
        description: Helm publish mode.
        type: choice
        options:
          - dry-run
          - none
          - full
        default: dry-run
      release:
        description: Release run mode.
        type: choice
        options:
          - dry-run
          - none
          - release
        default: dry-run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-workflow:
    name: Run
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # https://docs.stepsecurity.io/harden-runner/workflow-runs
      # https://github.com/marketplace/actions/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit
      - id: conclusion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          result-encoding: string
          script: |-
            const { data } = await github.rest.actions.listWorkflowRuns({
              branch: process.env.GITHUB_REF_NAME,
              owner: context.repo.owner,
              page: 1,
              per_page: 1,
              repo: context.repo.repo,
              workflow_id: process.env.WORKFLOW_ID,
            })

            const latest = data.workflow_runs.at(0)
            if (!latest) {
              throw new Error(`No '${process.env.WORKFLOW_ID}' workflow runs found on ref name '${process.env.GITHUB_REF_NAME}'`)
            }
            return latest.conclusion
        env:
          WORKFLOW_ID: integration.yml
      - if: ${{ steps.conclusion.outputs.result != 'success' }}
        run: |-
          echo "Latest '$WORKFLOW_ID' workflow on '$GITHUB_REF_NAME' isn't in success conclusion: '$WORKFLOW_CONCLUSION'" && exit 1
        env:
          WORKFLOW_CONCLUSION: ${{ steps.conclusion.outputs.result }}
          WORKFLOW_ID: integration.yml

  version:
    name: Version
    runs-on: ubuntu-latest
    needs: run-workflow
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      id-token: none
    steps:
      # https://docs.stepsecurity.io/harden-runner/workflow-runs
      # https://github.com/marketplace/actions/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # https://github.com/marketplace/actions/setup-node-js-environment
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
      - id: plugins
        run: echo "list=$(paste -sd' ' .github/semrel-plugins.txt)" >> "$GITHUB_OUTPUT"
      # https://github.com/marketplace/actions/action-for-semantic-release
      - id: semrel_version
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          # renovate: datasource=github-tags packageName=semantic-release/semantic-release depName=semantic-release
          semantic_version: v25.0.9
          extra_plugins: ${{ steps.plugins.outputs.list }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |-
          if [ -n "$APP_VERSION" ]; then
            echo "version=v${APP_VERSION#v}" >> $GITHUB_OUTPUT
          else
            DESCRIBE=$(git describe --tags || echo "v0.0.0")
            echo "version=v${DESCRIBE#v}" >> $GITHUB_OUTPUT
          fi
        env:
          APP_VERSION: ${{ steps.semrel_version.outputs.new_release_version }}
      - run: echo ${APP_VERSION}
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

  docker-build:
    name: Docker Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: .
            path: path/to/image
    permissions:
      packages: none
      security-events: write
    steps:
      # https://docs.stepsecurity.io/harden-runner/workflow-runs
      # https://github.com/marketplace/actions/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo-and-containers: false # docker use
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: image
        run: |-
          image_name="${{ matrix.path }}"
          if [[ "${APP_VERSION#v}" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "stable=true" >> $GITHUB_OUTPUT
          else
            echo "stable=false" >> $GITHUB_OUTPUT
            image_name="$image_name/snapshot"
          fi

          image="registry.example.com/$image_name"
          echo "Building docker image with full name '$image'"
          echo "image=$image" >> $GITHUB_OUTPUT

          echo "full_image=$image:$APP_VERSION" >> $GITHUB_OUTPUT
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ssZ'}}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=semver,enable=true,pattern={{raw}},value=${{ needs.version.outputs.version }}
            type=semver,enable=${{ steps.image.outputs.stable }},pattern=v{{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,enable=${{ steps.image.outputs.stable }},pattern=v{{major}},value=${{ needs.version.outputs.version }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.example.com
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.directory }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_REF_NAME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.ref.name'] }}
            GIT_COMMIT=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            APP_VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          exit-code: 0
          format: sarif
          ignore-unfixed: false
          image-ref: ${{ steps.image.outputs.full_image }}
          output: trivy-results.sarif
          severity: MEDIUM,HIGH,CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.repository_owner }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_TOKEN }}
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: docker-trivy/${{ matrix.directory }}
          sarif_file: trivy-results.sarif

  helm-push:
    name: Helm Push
    runs-on: ubuntu-latest
    if: ${{ inputs.helm_push != 'none' }}
    needs:
      - docker-build
      - version
    permissions:
      packages: none
    steps:
      # https://docs.stepsecurity.io/harden-runner/workflow-runs
      # https://github.com/marketplace/actions/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # https://github.com/marketplace/actions/helm-tool-installer
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-tags packageName=helm/helm depName=helm
          version: v4.2.4
      - run: helm package --version "$APP_VERSION" --app-version "$APP_VERSION" --dependency-update "$HELM_CHART_DIR"
        env:
          HELM_CHART_DIR: chart/
          APP_VERSION: ${{ needs.version.outputs.version }}
      - run: |-
          helm plugin install https://github.com/chartmuseum/helm-push
          helm registry login "$HELM_REGISTRY" -u "$HELM_REPO_USERNAME" -p "$HELM_REPO_ACCESS_TOKEN"
          if [ "$HELM_DRY_RUN" = "false" ]; then
            helm cm-push "$HELM_CHART_PATH" "$HELM_PUBLISH_URL"
          else
            echo "should push $HELM_CHART_PATH to $HELM_PUBLISH_URL"
          fi
        env:
          HELM_CHART_PATH: ${{ github.event.repository.name }}-${{ needs.version.outputs.version }}.tgz
          HELM_DRY_RUN: ${{ inputs.helm_push != 'full' }}
          HELM_PUBLISH_URL: chartmuseum.example.com/path/to/repository
          HELM_REGISTRY: chartmuseum.example.com
          HELM_REPO_ACCESS_TOKEN: ${{ secrets.HELM_REPO_ACCESS_TOKEN || secrets.HELM_REPO_PASSWORD }}
          HELM_REPO_AUTH_HEADER: ${{ secrets.HELM_REPO_AUTH_HEADER }}
          HELM_REPO_USE_HTTP: ${{ secrets.HELM_REPO_USE_HTTP }}
          HELM_REPO_USERNAME: ${{ secrets.HELM_REPO_USERNAME || github.repository_owner }}

  helm-deploy:
    name: Helm Deploy (${{ matrix.environment }})
    runs-on: ubuntu-latest
    if: ${{ inputs.helm_deploy != 'none' }}
    needs:
      - helm-push
      - version
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          - staging
          - production
        production:
          - ${{ github.ref_name == github.event.repository.default_branch }}
        protected:
          - ${{ github.ref_name == github.event.repository.default_branch || github.ref_protected }}
        # see https://github.com/orgs/community/discussions/26253#discussioncomment-3250989
        # for more information about how to include environments depending on branches
        include:
          - environment: staging # enabled on production branches
            production: true
          - environment: production # enabled on production branches
            production: true
    steps:
      # https://docs.stepsecurity.io/harden-runner/workflow-runs
      # https://github.com/marketplace/actions/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # https://github.com/marketplace/actions/helm-tool-installer
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-tags packageName=helm/helm depName=helm
          version: v4.2.4
      - shell: bash
        run: |-
          args=(--install --kube-context "$ENVIRONMENT" --version "$APP_VERSION" -f "$HELM_CHART_DIR/values.yaml" --set "appVersion=$APP_VERSION")
          [ -z "$HELM_ARGS" ] || args+=("$HELM_ARGS")
          [ -z "$HELM_DRY_RUN" ] || args+=("$HELM_DRY_RUN")

          name="$GITHUB_REPOSITORY_NAME-$APP_VERSION"
          [ "$ENVIRONMENT" = "review" ] || name="$GITHUB_REPOSITORY_NAME"

          echo "Running helm upgrade with args '${args[@]}'"
          helm upgrade "${args[@]}" "$name" "${HELM_CHART_URL:-$HELM_CHART_DIR}"
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          HELM_ARGS: ${{ vars.HELM_ARGS }}
          HELM_CHART_DIR: chart/
          HELM_CHART_URL: chartmuseum.example.com/path/to/repository
          HELM_DRY_RUN: ${{ inputs.helm_deploy }}
          APP_VERSION: ${{ needs.version.outputs.version }}

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ inputs.release != 'none' && github.ref_protected }}
    needs:
      - docker-build
      - helm-push
      - helm-deploy
    environment:
      name: release
      url: ${{ steps.environment_url.outputs.environment_url }}
    permissions:
      id-token: none
    steps:
      # https://docs.stepsecurity.io/harden-runner/workflow-runs
      # https://github.com/marketplace/actions/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: dist
      # https://github.com/marketplace/actions/setup-node-js-environment
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
      - id: plugins
        run: echo "list=$(paste -sd' ' .github/semrel-plugins.txt)" >> "$GITHUB_OUTPUT"
      # https://github.com/marketplace/actions/action-for-semantic-release
      - id: semrel_version
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: ${{ inputs.release != 'release' }}
          # renovate: datasource=github-tags packageName=semantic-release/semantic-release depName=semantic-release
          semantic_version: v25.0.9
          extra_plugins: ${{ steps.plugins.outputs.list }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: environment_url
        if: ${{ inputs.release == 'release' && steps.semrel_version.outputs.new_release_published == 'true' }}
        run: |-
          [ -z "$APP_VERSION" ] || echo "environment_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${APP_VERSION#v}" >> $GITHUB_OUTPUT
        env:
          APP_VERSION: ${{ steps.semrel_version.outputs.new_release_version }}
