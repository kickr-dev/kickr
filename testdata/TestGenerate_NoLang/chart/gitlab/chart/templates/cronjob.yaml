{{/* Code generated by kickr; DO NOT EDIT. */}}

{{- $fullname := include (print .Chart.Name ".fullname") . -}}
{{- $labels := include (print .Chart.Name ".labels") . -}}
{{- $selectorLabels := include (print .Chart.Name ".selectorLabels") . -}}
{{- $serviceAccountName := include (print .Chart.Name ".serviceAccountName") . -}}

{{- define "kickr.cronjob.item" -}}
{{- $item := . -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ print $item.fullname "-" $item.name }}
  labels:
    {{- $item.labels | nindent 4 }}
spec:
  suspend: {{ $item.config.suspend }}
  schedule: {{ $item.config.schedule | quote }}
  concurrencyPolicy: {{ $item.config.concurrencyPolicy }}
  failedJobsHistoryLimit: {{ $item.config.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ $item.config.successfulJobsHistoryLimit }}
  jobTemplate:
    spec:
      completionMode: {{ $item.config.completionMode }}
      completions: {{ $item.config.completions }}
      parallelism: {{ $item.config.parallelism }}
      selector:
        matchLabels:
          {{- $item.selectorLabels | nindent 10 }}
      template:
        metadata:
          {{- with $item.config.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- $item.selectorLabels | nindent 12 }}
        spec:
          {{- with $item.root.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ $item.serviceAccountName }}
          {{- with $item.config.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ $item.name }}
              {{- with $item.config.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- if $item.config.image.registry }}
              image: "{{ $item.config.image.registry }}/{{ $item.config.image.repository }}:{{ $item.config.image.tag | default $item.root.Values.appVersion | default $item.root.Chart.AppVersion }}"
              {{- else }}
              image: "{{ $item.config.image.repository }}:{{ $item.config.image.tag | default $item.root.Values.appVersion | default $item.root.Chart.AppVersion }}"
              {{- end }}
              {{- with $item.config.image.pullPolicy }}
              imagePullPolicy: {{ . }}
              {{- end }}
              {{- with $item.config.env }}
              env:
                {{- range $name, $value := . }}
                - name: {{ $name }}
                  value: {{ $value | quote }}
                {{- end }}
              {{- end }}
              {{- with $item.config.envFrom }}
              envFrom:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- if or $item.config.configMap $item.config.volumeMounts }}
              volumeMounts:
                {{- with $item.config.configMap }}
                - name: {{ print $item.fullname "-" $item.name }}
                  mountPath: {{ .mountPath }}
                {{- end }}
                {{- with $item.config.volumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- end }}
              resources:
                {{- toYaml $item.config.resources | nindent 16 }}
          restartPolicy: {{ $item.config.restartPolicy }}
          {{- if or $item.config.configMap $item.config.volumes }}
          volumes:
            {{- with $item.config.configMap }}
            - name: {{ print $item.fullname "-" $item.name }}
              configMap:
                name: {{ print $item.fullname "-" $item.name }}
            {{- end }}
            {{- with $item.config.volumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $item.config.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $item.config.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $item.config.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end -}}

{{- $items := list }}
{{- range $name, $config := .Values.crons }}
{{- $items = append $items (dict "fullname" $fullname "name" $name "config" $config "labels" $labels "selectorLabels" $selectorLabels "serviceAccountName" $serviceAccountName "root" $) }}
{{- end }}
{{- if $items }}
---
apiVersion: v1
kind: List
items:
  {{- range $items }}
  - {{ include "kickr.cronjob.item" . | nindent 4 | trim }}
  {{- end }}
{{- end -}}
