    containerImageMustNotUseForbiddenTags:
      enabled: true
      tags:
        - latest
        - dev
        - development
        - staging
        - main
        - master
      # Takes precedence over the tags list.
      containerImagesMustBePinnedByDigest: true

    # Flags `docker:dind` services, plaintext DOCKER_HOST and empty DOCKER_TLS_CERTDIR.
    pipelineMustNotUseDockerInDocker:
      enabled: true
      detectInsecureDaemon: true

    # Flags pipe-to-shell, download-then-exec and base64-obfuscated payloads in `run:` steps.
    pipelineMustNotExecuteUnverifiedScripts:
      enabled: true
      trustedUrls: []
      # - https://internal-artifacts.example.com/*

    # Detects `jobs.<name>.secrets: inherit` calls, use an explicit secrets map instead.
    reusableWorkflowsMustNotInheritSecrets:
      enabled: true

    # Flags `actions/checkout` without `persist-credentials: false` (GITHUB_TOKEN left in `.git/config`).
    checkoutMustNotPersistCredentials:
      enabled: true

    # Flags jobs serializing the whole `secrets` context with toJson(secrets), reference each secret by name instead.
    workflowMustNotExportEntireSecretsContext:
      enabled: true

    # Flags security jobs neutralized by `continue-on-error: true` or manual-dispatch-only triggers.
    # Patterns are globs on `<workflow filename without extension>/<job id>` (e.g. codeql/analyze).
    securityJobsMustNotBeWeakened:
      enabled: true
      securityJobPatterns:
        - "*codeql*"
        - "*dependency-review*"
        - "*trufflehog*"
        - "*gitleaks*"
        - "*osv-scanner*"
        - "*semgrep*"
        - "*trivy*"
        - "*snyk*"
