        - "*-sast-*"
        - "*-scan"
        - "*scan*"
        - "*-security"
        - "*-security-*"
        - "*-audit"
        - "*-audit-*"
        - "*secret*detect*"
        - "*detect*secret*"
      allowFailureMustBeFalse:
        enabled: true
      rulesMustNotBeRedefined:
        enabled: true
      whenMustNotBeManual:
        enabled: true

    # Flags attacker-controlled `github.event.*`, `github.head_ref` or `github.actor` interpolated into `run:` (bind through `env:` first).
    workflowMustNotInjectUserInputInScripts:
      enabled: true

    # Flags `run:` steps writing attacker-controlled expressions into $GITHUB_ENV or $GITHUB_PATH.
    workflowMustNotWriteUntrustedContentToGitHubEnv:
      enabled: true

    # Flags `pull_request_target` and `workflow_run` triggers (base repository secrets, influenceable by unprivileged callers).
    workflowMustNotUseDangerousTriggers:
      enabled: true

    # Flags `pull_request_target` workflows checking out the pull request head (secrets and fork code run together).
    pullRequestTargetMustNotCheckoutHead:
      enabled: true

    # Flags workflows without an explicit `permissions:` block (falls back to the repository default GITHUB_TOKEN).
    workflowsMustDeclarePermissions:
      enabled: true

    # Inspects repository settings via the GitHub branch-protection API.
    # Needs a token with `repo` scope or "Administration: read", emits no findings otherwise.
    branchMustBeProtected:
      enabled: true
      defaultMustBeProtected: true
      namePatterns:
        - main
        - master
        - release/*
        - production
        - dev
      allowForcePush: false
      codeOwnerApprovalRequired: true

    # Requires workflows to reference the given actions or reusable workflows, checks nothing when empty.
    # Use one of:
    #   required: (myorg/sast-scan AND myorg/secret-scan) OR myorg/full-security-suite
    #   requiredGroups: [["myorg/sast-scan", "myorg/dependency-review"], ["myorg/full-security-suite"]]
    workflowMustIncludeRequiredActions:
      enabled: true
      # required: myorg/sast-scan AND myorg/policy/.github/workflows/scan.yml
      requiredGroups: []

    workflowMustNotGrantPermissionsWriteAll:
      enabled: true

    # Flags `uses: owner/repo@ref` refs that exist upstream as both tag and branch (pin to a commit SHA).
    # Requires GitHub API auth, abstains otherwise.
    externalRefsMustNotCollide:
      enabled: true

    # Requires GitHub API auth, abstains otherwise.
    actionsMustNotBeArchived:
      enabled: true

    # Requires GitHub API auth, abstains otherwise.
    actionRefsMustExistUpstream:
      enabled: true

    # Requires GitHub API auth, abstains otherwise.
    actionsMustNotCarryKnownCVEs:
      enabled: true

    # Flags third-party actions executing a script from a moving ref (main/master/HEAD) of another repository.
    # Requires GitHub API auth.
    actionsMustNotExecuteMutableRemoteCode:
      enabled: true

    # Flags release/publish jobs restoring a cache whose key isn't scoped to the release ref (github.ref_name / github.sha).
    releaseWorkflowsMustNotRestoreUntrustedCache:
      enabled: true
      publishActions:
        - pypa/gh-action-pypi-publish
        - JS-DevTools/npm-publish
        - gradle/publish-plugin
        - softprops/action-gh-release
        - ncipollo/release-action
        - goreleaser/goreleaser-action
        - crazy-max/ghaction-docker-buildx
        - changesets/action
      # Cache-restoring actions and their mode:
      #   always restores whenever present
      #   default restores unless disableInput holds disableValue
      #   opt-in restores only when enableInput names a package manager (enableContains also requires that substring)
      cacheActions:
        - {action: actions/cache, mode: always}
        - {action: actions/cache/restore, mode: always}
        - {action: Swatinem/rust-cache, mode: always}
        - {action: actions/setup-go, mode: default, disableInput: cache, disableValue: false}
        - {action: gradle/actions/setup-gradle, mode: default, disableInput: cache-disabled, disableValue: true}
        - {action: actions/setup-node, mode: opt-in, enableInput: cache}
        - {action: actions/setup-python, mode: opt-in, enableInput: cache}
        - {action: actions/setup-java, mode: opt-in, enableInput: cache}
        - {action: pnpm/action-setup, mode: opt-in, enableInput: cache}
        - {action: docker/build-push-action, mode: opt-in, enableInput: cache-from, enableContains: type=gha}
      # Shell commands (regex) marking a job as a release even without a publish action.
      publishScriptPatterns:
        - '(?i)(npm|pnpm|yarn|bun)\s+publish'
        - '(?i)cargo\s+publish'
        - '(?i)twine\s+upload'
        - '(?i)poetry\s+publish'
        - '(?i)gh\s+release\s+create'
        - '(?i)goreleaser\s+release'
        - '(?i)semantic-release'
        - '(?i)gradlew?\b[^\n]*\bpublish'
        - '(?i)\bmvnw?\b[^\n]*\bdeploy\b'
        - '(?i)dotnet\s+nuget\s+push'
        - '(?i)gem\s+push'
        - '(?i)docker\s+push'
      # Verification-only forms vetoing a publish-script match.
      publishScriptExcludePatterns:
        - '(?i)--dry-run'
        - '(?i)publishToMavenLocal'
