# Code generated by kickr; DO NOT EDIT.

name: Kickr
run-name: Kickr

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kickr:
    name: Kickr
    runs-on: ubuntu-latest
    environment: kickr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          check-latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: go install github.com/kickr-dev/kickr/cmd/kickr@main
      - run: |
          kickr generate
          git status -s
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          body: "Automated kickr layout generation"
          branch: kickr/layout
          commit-message: "ci(layout): regenerate kickr layout"
          labels: dependencies,kickr
          sign-commits: true
          signoff: true
          title: "ci(layout): regenerate kickr layout"
          token: ${{ secrets.KICKR_TOKEN }}
