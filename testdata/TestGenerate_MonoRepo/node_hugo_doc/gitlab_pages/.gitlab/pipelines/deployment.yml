include: []

.pages:
  image: $PAGES_IMAGE
  stage: deploy
  environment:
    name: pages${PAGES_ENVIRONMENT_NAMESPACE}
    action: start
    url: $CI_PAGES_URL
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
      when: never
  script:
    - cd "$PAGES_PROJECT_DIR"
      if [ "$BUILD_DIR" != "public" ]; then
        mkdir -p public
        mv "$BUILD_DIR"/* public
      fi
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    paths:
      - public
    expire_in: 1 day

pages-docs:
  extends: .pages
  variables:
    PAGES_ENVIRONMENT_NAMESPACE: /docs
    PAGES_PROJECT_DIR: docs
  dependencies:
    - "hugo-build: [docs]"
  when: manual

pages-website:
  extends: .pages
  variables:
    PAGES_ENVIRONMENT_NAMESPACE: /website
    PAGES_PROJECT_DIR: website
  dependencies:
    - "hugo-build: [website]"
