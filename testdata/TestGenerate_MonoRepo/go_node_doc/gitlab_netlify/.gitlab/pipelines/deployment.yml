  dependencies:
    - node-build
    - semantic-release-info
  rules:
    - if: '$NETLIFY_REVIEW_ENABLED == "false"'
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ $PROD_REF'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: manual
      allow_failure: true
  variables:
    ARGS: --alias=$BRANCH_SHA --context branch:$BRANCH_SHA --message=$CI_COMMIT_REF_NAME
    NETLIFY_PROJECT_DIR: docs

netlify-cleanup-review:
  extends: .netlify-cleanup
  environment:
    name: review${NETLIFY_ENVIRONMENT_NAMESPACE}/${CI_COMMIT_REF_NAME}
    action: stop
  rules: !reference [netlify-deploy-review, rules]

netlify-deploy-production:
  extends: .netlify-deploy
  environment:
    name: production${NETLIFY_ENVIRONMENT_NAMESPACE}
    action: start
    url: $ENVIRONMENT_URL
  dependencies:
    - node-build
    - semantic-release-info
  rules:
    - if: '$CI_COMMIT_REF_NAME !~ $PROD_REF'
      when: never
    - when: manual
  variables:
    ARGS: --prod --message=$CI_COMMIT_REF_NAME
    NETLIFY_PROJECT_DIR: docs

docker-hadolint:
  needs: []

.docker-publish:
  # see https://gitlab.com/to-be-continuous/docker/-/blob/main/templates/gitlab-ci-docker.yml?ref_type=heads#L1518
  rules:
    - if: '$DOCKER_PUBLISH_ON == "tag" && $CI_COMMIT_TAG !~ $RELEASE_REF'
      when: never
    - if: '$DOCKER_PUBLISH_ON == "prod" && $CI_COMMIT_REF_NAME !~ $PROD_REF'
      when: never
    - if: '$DOCKER_PUBLISH_ON == "protected" && $CI_COMMIT_REF_PROTECTED != "true"'
      when: never

docker-publish:
  rules:
    - !reference [.docker-publish, rules]
    - if: '$DOCKER_PROD_PUBLISH_STRATEGY == "manual"'
      when: manual
    - if: '$DOCKER_PROD_PUBLISH_STRATEGY == "auto"'

