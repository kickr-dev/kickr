      healthcheck-disabled: true # https://docs.docker.com/reference/dockerfile/#healthcheck
      prod-publish-strategy: manual
      release-extra-tags: latest \\g<major> \\g<major>.\\g<minor>
      release-extra-tags-pattern: ^v?(?P<major>[0-9]+)\.(?P<minor>[0-9]+)\.(?P<patch>[0-9]+)$
      semrel-release-disabled: true # avoid too much dependency on semantic-release
      trivy-args: --ignore-unfixed --exit-code 1 --exit-on-eol 1

.kickr-workflow-rules:
  # skip deployments on merge trains so destroy jobs from branch or merge request pipelines can run
  merge-train:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      variables:
        NETLIFY_REVIEW_ENABLED: "false"
  default:
    - !reference [.kickr-workflow-rules, merge-train]

workflow:
  rules:
    - !reference [.tbc-workflow-rules, default]
    - !reference [.kickr-workflow-rules, default]
    - when: always

.artifacthub:
  stage: publish
  image:
    name: $ORAS_IMAGE
    entrypoint: [""]
  script:
    - oci_ref="${repository#oci://}"
    - echo "$password" | oras login "${oci_ref%%/*}" -u "$username" --password-stdin
    - |
      oras push "$oci_ref:artifacthub.io" \
        --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
        "$artifacthub_file:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

.netlify-deploy:
  image: $NETLIFY_IMAGE
  stage: deploy
  before_script:
    - npm install -g netlify-cli
    - apk add --no-cache jq
  script:
    # netlify-cli reads netlify.toml from the current directory
    - cd "$NETLIFY_PROJECT_DIR"
    - environment_namespace=$(echo "$NETLIFY_ENVIRONMENT_NAMESPACE" | tr -d '[:punct:]' | tr '[:upper:]' '[:lower:]')
    - export environment_namespace
    - netlify deploy --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --dir "$BUILD_DIR" $ARGS --json > netlify-deploy.json
    - dotenvfile="netlify.env${environment_namespace:+.${environment_namespace}}"
    - echo "ENVIRONMENT_URL=$(jq -r '.url // .deploy_url' netlify-deploy.json)" >> "$CI_PROJECT_DIR/$dotenvfile"
  artifacts:
    reports:
      dotenv: $CI_PROJECT_DIR/netlify.env*

.netlify-cleanup:
  image: $NETLIFY_IMAGE
  stage: deploy
  dependencies: []
  variables:
    GIT_STRATEGY: none
  before_script:
    - npm install -g netlify-cli
    - apk add --no-cache jq
  script:
    - branch_sha="$(echo "$CI_COMMIT_REF_NAME" | sha256sum | cut -c -8)"
    - |
      netlify api listSiteDeploys \
        --auth "$NETLIFY_AUTH_TOKEN" \
        --data "{\"site_id\": \"$NETLIFY_SITE_ID\", \"branch\": \"$branch_sha\"}" > netlify-deploys.json
    - |
      for id in $(jq -r '.[].id' netlify-deploys.json); do
        netlify api deleteSiteDeploy --auth "$NETLIFY_AUTH_TOKEN" --data "{\"site_id\": \"$NETLIFY_SITE_ID\", \"deploy_id\": \"$id\"}"
      done

netlify-deploy-review:
  extends: .netlify-deploy
  environment:
    name: review${NETLIFY_ENVIRONMENT_NAMESPACE}/${CI_COMMIT_REF_NAME}
    action: start
    on_stop: netlify-cleanup-review
